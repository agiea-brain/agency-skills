# After skill content lands on main: build index.json, publish it to the orphan
# `index` branch, and (if configured) ping the downstream server so it re-syncs.
#
# Stable "latest":  https://raw.githubusercontent.com/<repo>/index/index.json
# Pinned (sent in the webhook, bypasses raw.githubusercontent's cache):
#                   https://raw.githubusercontent.com/<repo>/<index sha>/index.json
#
# Config: repo secrets SYNC_WEBHOOK_URL and SYNC_WEBHOOK_TOKEN (optional).
# workflow_dispatch allows a manual full re-publish at any time.

name: publish-index

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'schema/**'
      - 'tools/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate library
        run: node tools/validate.mjs

      - name: Build index.json
        run: node tools/build-index.mjs --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/index.json"

      - name: Publish to the index branch
        id: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin index >/dev/null 2>&1; then
            git fetch origin index
            git worktree add "$RUNNER_TEMP/index-branch" index
          else
            git worktree add --detach "$RUNNER_TEMP/index-branch"
            git -C "$RUNNER_TEMP/index-branch" switch --orphan index
          fi
          cp "$RUNNER_TEMP/index.json" "$RUNNER_TEMP/index-branch/index.json"
          printf '# index\n\nGenerated by the publish-index workflow. Do not edit. Source: the `main` branch.\n' > "$RUNNER_TEMP/index-branch/README.md"
          cd "$RUNNER_TEMP/index-branch"
          git add index.json README.md
          if git diff --cached --quiet; then
            echo "index unchanged"
          else
            git commit -m "index: ${GITHUB_SHA::7}"
            git push origin HEAD:index
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Notify downstream
        env:
          SYNC_WEBHOOK_URL: ${{ secrets.SYNC_WEBHOOK_URL }}
          SYNC_WEBHOOK_TOKEN: ${{ secrets.SYNC_WEBHOOK_TOKEN }}
          INDEX_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          if [ -z "$SYNC_WEBHOOK_URL" ]; then
            echo "sync webhook not configured - skipping"
            exit 0
          fi
          curl -fsS -X POST "$SYNC_WEBHOOK_URL" \
            -H "Authorization: Bearer $SYNC_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"$GITHUB_REPOSITORY\",\"ref\":\"$GITHUB_SHA\",\"indexRef\":\"$INDEX_SHA\",\"indexUrl\":\"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$INDEX_SHA/index.json\"}"
